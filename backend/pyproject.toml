[tool.ruff]
line-length = 100

[tool.pylint.MASTER]
load-plugins = ["pylint_django", "pylint.extensions.docparams"]
ignore-paths = [".*/migrations/.*"]
# Pass as long as the score is at least this; pylint exits 0 when score >= fail-under.
fail-under = 9.60

[tool.pylint.DJANGO]
django-settings-module = "config.settings"
